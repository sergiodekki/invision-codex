# Invision: compara com openai/codex toda semana e abre PR para revisão. Nunca empurra para main nem promove produção sozinho.
name: invision-sync
on:
  schedule: [{ cron: "0 6 * * 1" }]
  workflow_dispatch:
permissions: { contents: write, pull-requests: write, issues: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Branch de atualização + PR
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "invision-bot"; git config user.email "bot@dreamvision.com.br"
          git remote add upstream https://github.com/openai/codex.git && git fetch upstream main
          UP=$(git rev-parse --short upstream/main); B="upstream-sync/$UP"
          git checkout -b "$B"
          if git merge --no-edit upstream/main; then
            git push origin "$B"
            gh pr create --base main --head "$B" --title "Atualizar upstream openai/codex ($UP)" --body "Revisar patches Invision e rodar testes do provedor/protocolo antes do merge. Produção só muda quando o SHA for fixado no Dockerfile da Invision."
          else git merge --abort; gh issue create --title "Sync upstream $UP em conflito" --body "Resolver manualmente."; exit 1; fi
