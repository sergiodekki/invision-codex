# Invision: mantém o fork atualizado com openai/codex toda semana (merge, nunca rebase).
name: invision-sync
on:
  schedule: [{ cron: "0 6 * * 1" }]
  workflow_dispatch:
permissions: { contents: write, issues: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, token: "${{ secrets.INVISION_SYNC_TOKEN || github.token }}" }
      - name: Merge upstream
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "invision-bot"; git config user.email "bot@dreamvision.com.br"
          git remote add upstream https://github.com/openai/codex.git
          git fetch upstream main
          if git merge --no-edit upstream/main; then git push origin main
          else git merge --abort; gh issue create --title "Sync com openai/codex em conflito" --body "Resolver manualmente o merge de upstream/main."; exit 1; fi
