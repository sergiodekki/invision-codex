# Invision: compila o binário Linux (glibc, imagem Debian do app) e publica como release.
# glibc porque o codex-code-mode-host embute V8, que não tem build pronto para musl.
#
# A Invision fixa a versão usada pela tag (`CODEX_RELEASE` no Dockerfile dela), nunca pela `latest`.
# - push na main: release normal.
# - workflow_dispatch em outro ramo (ex.: juntar o upstream): pré-release, sem virar a `latest`.
#   A Invision só passa a usar depois do teste de contrato e de trocar a tag no Dockerfile.
name: invision-release
on:
  push:
    branches: [main]
    paths: ["codex-rs/**", ".github/workflows/invision-release.yml"]
  workflow_dispatch:
    inputs:
      so_testes:
        description: "Só os testes, sem montar nem publicar release"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  # Testes do provedor e do app-server (o protocolo que a Invision fala). Rodam junto com o build.
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Rust (glibc)
        working-directory: codex-rs
        run: |
          sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
          rustup show
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: codex-rs, prefix-key: v2-gnu-2204-tests }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ./.github/actions/setup-rusty-v8
        with: { target: x86_64-unknown-linux-gnu }
      # Cache parcial do rust-cache marca o v8 como compilado sem guardar o librusty_v8.a
      # ("could not find native static library rusty_v8", 25/11): refaz o script do v8, que só
      # desempacota o arquivo pronto e conferido acima.
      - name: Refaz o v8 a partir do arquivo pronto
        working-directory: codex-rs
        run: rm -rf target/*/build/v8-* target/*/.fingerprint/v8-* target/*/*/build/v8-* target/*/*/.fingerprint/v8-*
      - uses: taiki-e/install-action@v2
        with: { tool: nextest }
      - name: Testes do provedor Invision e do protocolo
        working-directory: codex-rs
        run: cargo nextest run --no-fail-fast -p codex-model-provider-info -p codex-app-server-protocol
      # Mesma preparação do CI do upstream (rust-ci-full-nextest-platform.yml): binários que os testes chamam
      # (codex, code-mode-host, sandbox, servidores MCP de teste), pilha de 8 MiB e o ajudante de sandbox.
      - name: Binários auxiliares dos testes
        working-directory: codex-rs
        run: |
          sudo apt-get install -y bubblewrap
          cargo build -p codex-cli --bin codex -p codex-code-mode-host --bin codex-code-mode-host -p codex-linux-sandbox --bin codex-linux-sandbox -p codex-rmcp-client --bins
      - name: Testes do app-server
        working-directory: codex-rs
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: "0"
          RUST_MIN_STACK: "8388608"
        run: |
          helper="$PWD/target/debug/codex-linux-sandbox"
          env "CARGO_BIN_EXE_codex-linux-sandbox=$helper" "CARGO_BIN_EXE_codex_linux_sandbox=$helper" \
            cargo nextest run --no-fail-fast -p codex-app-server
  build:
    if: ${{ !inputs.so_testes }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Rust (glibc)
        working-directory: codex-rs
        run: |
          sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
          rustup show
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: codex-rs, prefix-key: v2-gnu-2204 }
      - name: Testes do provedor Invision
        working-directory: codex-rs
        run: cargo test -p codex-model-provider-info invision
      # V8 pronto e conferido por checksum (manifesto em third_party/v8), igual à release oficial.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ./.github/actions/setup-rusty-v8
        with: { target: x86_64-unknown-linux-gnu }
      # Mesmo motivo do job de testes: o cache parcial não guarda o librusty_v8.a.
      - name: Refaz o v8 a partir do arquivo pronto
        working-directory: codex-rs
        run: rm -rf target/*/build/v8-* target/*/.fingerprint/v8-* target/*/*/build/v8-* target/*/*/.fingerprint/v8-*
      - name: Build
        working-directory: codex-rs
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu -p codex-cli --bin codex -p codex-code-mode-host --bin codex-code-mode-host
      - name: Teste do pacote
        run: |
          set -e
          D=codex-rs/target/x86_64-unknown-linux-gnu/release
          $D/codex --version
          test -x $D/codex-code-mode-host
          ldd $D/codex $D/codex-code-mode-host
          sha256sum $D/codex $D/codex-code-mode-host | tee SHA256SUMS
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="invision-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then FLAGS="--latest"; else FLAGS="--prerelease --latest=false"; fi
          cp codex-rs/target/x86_64-unknown-linux-gnu/release/codex codex-invision-linux-x64
          cp codex-rs/target/x86_64-unknown-linux-gnu/release/codex-code-mode-host codex-code-mode-host-linux-x64
          gh release create "$TAG" codex-invision-linux-x64 codex-code-mode-host-linux-x64 SHA256SUMS --title "$TAG" --target "$GITHUB_SHA" --notes "Build Invision de ${GITHUB_SHA} (${GITHUB_REF_NAME}, x86_64-unknown-linux-gnu)" $FLAGS
