# Invision: compila o binário Linux (glibc, imagem Debian do app) e publica como release.
# glibc porque o codex-code-mode-host embute V8, que não tem build pronto para musl.
name: invision-release
on:
  push:
    branches: [main]
    paths: ["codex-rs/**", ".github/workflows/invision-release.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Rust (glibc)
        working-directory: codex-rs
        run: |
          sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
          rustup show
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: codex-rs, prefix-key: v2-gnu-2204 }
      - name: Testes do provedor Invision
        working-directory: codex-rs
        run: cargo test -p codex-model-provider-info invision
      # V8 pronto e conferido por checksum (manifesto em third_party/v8), igual à release oficial.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ./.github/actions/setup-rusty-v8
        with: { target: x86_64-unknown-linux-gnu }
      - name: Build
        working-directory: codex-rs
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu -p codex-cli --bin codex -p codex-code-mode-host --bin codex-code-mode-host
      - name: Teste do pacote
        run: |
          set -e
          D=codex-rs/target/x86_64-unknown-linux-gnu/release
          $D/codex --version
          test -x $D/codex-code-mode-host
          ldd $D/codex $D/codex-code-mode-host
          sha256sum $D/codex $D/codex-code-mode-host | tee SHA256SUMS
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="invision-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          cp codex-rs/target/x86_64-unknown-linux-gnu/release/codex codex-invision-linux-x64
          cp codex-rs/target/x86_64-unknown-linux-gnu/release/codex-code-mode-host codex-code-mode-host-linux-x64
          gh release create "$TAG" codex-invision-linux-x64 codex-code-mode-host-linux-x64 SHA256SUMS --title "$TAG" --notes "Build Invision de ${GITHUB_SHA} (x86_64-unknown-linux-gnu)" --latest
